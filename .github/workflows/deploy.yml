name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'go-gateway/**'
            java:
              - 'java-service/**'
            python:
              - 'python-ml-service/**'

  build-go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: plokoon68
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./go-gateway
          push: true
          tags: plokoon68/ai-dev-platform-go-gateway:latest
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

  build-java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: plokoon68
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./java-service
          push: true
          tags: plokoon68/ai-dev-platform-java-service:latest
          cache-from: type=gha,scope=java
          cache-to: type=gha,mode=max,scope=java

  build-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: plokoon68
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./python-ml-service
          push: true
          tags: plokoon68/ai-dev-platform-python-ml-service:latest
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python

  restart-ec2:
    # `changes` is needed here too — without it this job can't read the filter
    # outputs and has to pull every image blindly.
    needs: [changes, build-go, build-java, build-python]
    if: |
      always() &&
      (needs.build-go.result == 'success' ||
       needs.build-java.result == 'success' ||
       needs.build-python.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          GO_CHANGED: ${{ needs.changes.outputs.go }}
          JAVA_CHANGED: ${{ needs.changes.outputs.java }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          envs: GO_CHANGED,JAVA_CHANGED,PYTHON_CHANGED
          script: |
            cd ~
            # Pull only what was rebuilt. A blanket `docker-compose pull` re-checks
            # the ~1.5GB python image on every deploy, even for a one-line Go change.
            if [ "$GO_CHANGED" = "true" ]; then docker-compose pull go-gateway; fi
            if [ "$JAVA_CHANGED" = "true" ]; then docker-compose pull java-service; fi
            if [ "$PYTHON_CHANGED" = "true" ]; then docker-compose pull python-ml-service; fi
            docker-compose up -d
            # Each deploy orphans the previous :latest as a dangling image. Left alone
            # this fills an 8GB disk. -f removes only dangling ones, never in-use images.
            docker image prune -f

      # Until now a green check only meant "the SSH command ran". This makes it mean
      # "the gateway is actually answering".
      - name: Smoke test
        run: |
          sleep 30
          curl -fsS https://ai-dev-platform.duckdns.org/healthz
