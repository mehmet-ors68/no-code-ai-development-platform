name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'go-gateway/**'
            java:
              - 'java-service/**'
            python:
              - 'python-ml-service/**'

  build-go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: plokoon68
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./go-gateway
          push: true
          tags: plokoon68/ai-dev-platform-go-gateway:latest
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

  build-java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: plokoon68
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./java-service
          push: true
          tags: plokoon68/ai-dev-platform-java-service:latest
          cache-from: type=gha,scope=java
          cache-to: type=gha,mode=max,scope=java

  build-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: plokoon68
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./python-ml-service
          push: true
          tags: plokoon68/ai-dev-platform-python-ml-service:latest
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python

  restart-ec2:
    needs: [build-go, build-java, build-python]
    if: |
      always() &&
      (needs.build-go.result == 'success' ||
       needs.build-java.result == 'success' ||
       needs.build-python.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~
            docker-compose pull
            docker-compose up -d
