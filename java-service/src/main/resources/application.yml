spring:
  application:
    name: java-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dl_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:dl-platform-dev-secret-key-minimum-32-chars-ok}
  expiration-ms: 86400000
