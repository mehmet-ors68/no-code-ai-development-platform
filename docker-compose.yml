services:

  go-gateway:
    build: ./go-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_SERVICE_URL=http://java-service:8081
      - PYTHON_SERVICE_URL=http://python-ml-service:8000
    depends_on:
      - java-service
    networks:
      - dl-network

  java-service:
    build: ./java-service
    ports:
      - "8081:8081"
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - dl-network

  # python-ml-service:
  #   build: ./python-ml-service
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - MONGO_URI=${MONGO_URI}
  #   networks:
  #     - dl-network

  react:
    container_name: react_ui
    build:
      context: ./view
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    restart: always

networks:
  dl-network:
    driver: bridge
