services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback-only. Services reach each other by name over dl-network, so nothing
    # here needs a public binding — publishing to 0.0.0.0 would put an unauthenticated
    # Redis on the internet. Keeping the mapping (rather than dropping it) preserves
    # redis-cli from an SSH session.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dl-network

  java-service:
    image: plokoon68/ai-dev-platform-java-service:latest
    restart: unless-stopped
    # Loopback-only: Java trusts X-User-ID unconditionally, so anything that can reach
    # it directly can impersonate any user. Only the Gateway may talk to it.
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      # Poll fast only while booting — Spring needs ~10s, and go-gateway/python
      # are gated on this check. Steady-state cost stays at one curl per 10s.
      start_interval: 2s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - dl-network

  go-gateway:
    image: plokoon68/ai-dev-platform-go-gateway:latest
    restart: unless-stopped
    # Loopback-only: Nginx (on the host) proxies to 127.0.0.1:8080 and terminates TLS.
    # Published on 0.0.0.0 this served the whole API over plain HTTP on :8080, so a
    # login POST could be read off the wire.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - JAVA_SERVICE_URL=http://java-service:8081
      - PYTHON_SERVICE_URL=http://python-ml-service:8000
      - REDIS_URL=redis:6379
    depends_on:
      java-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dl-network

  python-ml-service:
    image: plokoon68/ai-dev-platform-python-ml-service:latest
    restart: unless-stopped
    # Loopback-only — same reasoning as java-service: X-User-ID is trusted, not verified.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Python calls Java directly over the internal network when saving dataset
      # metadata — the browser is not in that path.
      - JAVA_SERVICE_URL=http://java-service:8081
    depends_on:
      redis:
        condition: service_healthy
      java-service:
        condition: service_healthy
    networks:
      - dl-network

  # react:
  #   build:
  #     context: ./view
  #     dockerfile: Dockerfile
  #     target: production
  #   ports:
  #     - "80:80"
  #   networks:
  #     - dl-network

networks:
  dl-network:
    driver: bridge
